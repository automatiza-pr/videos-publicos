<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes de servicio – True Waste</title>
<style>
  :root { --navy:#1b2a4a; --blue:#1aa3e8; --gray:#5b6577; --line:#d7dde8; --bg:#f3f6fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:#111; }
  .top { background:#fff; border-bottom:3px solid var(--blue); padding:18px; text-align:center; }
  .top img { height:90px; }
  .top .co { font-size:13px; color:var(--gray); margin-top:4px; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .lbl { font-size:12px; color:var(--gray); text-transform:uppercase; letter-spacing:.5px; }
  .val { font-size:18px; font-weight:700; color:var(--navy); margin-bottom:8px; }
  .badge { display:inline-block; background:#e0f2fe; color:#075985; font-weight:700; padding:4px 10px; border-radius:20px; font-size:13px; }
  h2 { font-size:17px; color:var(--navy); margin:0 0 10px; }
  .rep { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .rep:first-of-type { border-top:0; }
  .rep .d { flex:1; }
  .rep .d b { color:var(--navy); font-size:16px; }
  .rep .d div { font-size:13px; color:var(--gray); }
  .rep a { background:var(--blue); color:#fff; text-decoration:none; font-weight:700; padding:10px 14px; border-radius:10px; font-size:15px; white-space:nowrap; }
  .last { background:#ecfdf5; border-color:#86efac; }
  .empty { color:var(--gray); text-align:center; padding:20px; }
  .tech { display:block; text-align:center; margin:22px auto 6px; color:var(--gray); font-size:14px; text-decoration:none; border:1px dashed var(--line); padding:12px; border-radius:10px; background:#fff; }
  footer { text-align:center; font-size:12px; color:var(--gray); padding:16px; }
</style>
</head>

document.getElementById('lista').innerHTML = ok.length ? ok.map(r => '<div class="rep"><div class="d"><b>'+fd(r.fecha)+'</b><div>Factura de Servicio '+esc(r.numero)+' · '+esc(r.tecnico)+'</div></div><a href="'+esc(r.pdf_url)+'" target="_blank">Ver PDF</a></div>').join('') : '<div class="empty">Sin reportes.</div>';
</script>
</body>
